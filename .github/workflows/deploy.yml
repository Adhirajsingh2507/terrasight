name: Deploy

# Guarded CD: no-ops when Vercel secrets aren't configured, so this workflow
# never fails a fork/PR run or a repo that hasn't set up deploy credentials.
# Manual only (workflow_dispatch) — adding this file triggers no deploy.
# One-time setup (repo secrets): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (the single `terrasight` project — `services` framework builds both apps).
# See DEPLOY.md.

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  skipped:
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "VERCEL_TOKEN not set — skipping deploy (no-op). See DEPLOY.md."

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
