# Prod-like local run of both services. Not used for the actual Vercel
# deploy (see DEPLOY.md) — this is for local/self-hosted verification.
#
# Service-role key rule: SUPABASE_KEY is read only by `backend`. `frontend`
# only ever receives NEXT_PUBLIC_API_URL (a public base URL, no secret).
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # Optional — unset means the API serves backend/mock/*.json (see app/db.py).
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
